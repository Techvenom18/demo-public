# .github/workflows/ci.yml
# Step 1 of the Jenkins -> GitHub Actions port: Checkout -> Build -> Test.
# It does NOT deploy anything yet. Deploy, backup, health check, rollback and
# the lock get added in later steps.

name: CI

on:
  push:                      # runs on every push to any branch
  workflow_dispatch:         # also lets you start it by hand from the Actions tab

permissions:
  contents: read             # the workflow may only read the repo

jobs:
  build-test:
    runs-on: ubuntu-latest   # fresh Ubuntu VM from GitHub, deleted after the run
    timeout-minutes: 15      # a stuck run cannot hang forever

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Show what was built
        run: ls -la dist || echo "No dist folder (this project has no build output)"